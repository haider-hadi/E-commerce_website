<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - E-Commerce Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo"><img src="paklogo.png" alt="Logo"></div>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="shop.html">Shop</a>
            <a href="cart.html">Cart</a>
            <a href="blog.html">Blog</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <img src="pak.png" alt="Banner 1">
            <h1>Welcome to Our Store</h1>
            <p>Shop the best products at amazing prices!</p>
            <a href="shop.html" class="btn">Shop Now</a>
        </section>

        <section class="featured-products">
            <h2>Featured Products</h2>
            <div class="product-grid">
                <div class="product-card">
                    <img src="shoe.jpg" alt="Product 1">
                    <h3>Black Stylish Shoes</h3>
                    <p>$49.99</p>
                    <button onclick="addToCart('Black Stylish Shoes', 49.99)">Add to Cart</button>
                </div>
                <div class="product-card">
                    <img src="shoes.jpg" alt="Product 2">
                    <h3>White Running Shoes </h3>
                    <p>$29.99</p>
                    <button onclick="addToCart('White Running Shoes', 29.99)">Add to Cart</button>
                </div>
                <div class="product-card">
                    <img src="brand.jpg" alt="Product 3">
                    <h3>High Fragrance Perfume</h3>
                    <p>$19.99</p>
                    <button onclick="addToCart('High Fragrance Perfume', 19.99)">Add to Cart</button>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Pakshopia. All Rights Reserved.</p>
        <div class="social-icons">
            <img src="paklogo.png" alt="Cart Icon">
        </div>
    </footer>

    <script src="main.js"></script>
</body>
</html>
